services:
    dynamodb:
        image: amazon/dynamodb-local:latest
        container_name: parcel-dynamodb
        command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
        user: root # lets the container write to the volume
        ports:
            - "8000:8000"
        volumes:
            - dynamodb-data:/home/dynamodblocal/data # keeps your data between restarts

volumes:
    dynamodb-data:
